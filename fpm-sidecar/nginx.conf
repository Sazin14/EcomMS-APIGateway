# HTTP front for a php-fpm-only Laravel image (AuthService, ProductService, OrderService run
# "php-fpm" on :9000 = FastCGI, which Kong cannot talk to). Run this nginx NEXT TO the service
# container (Kubernetes: a second container in the same Pod; Compose: network_mode: "service:<app>")
# and point Kong at port 8080. Pure API: every request goes to public/index.php, so nginx needs
# no copy of the code.
#
# Mount as /etc/nginx/conf.d/default.conf in an nginx:1.27 container.

server {
    listen 8080;
    server_name _;

    server_tokens off;
    client_max_body_size 5m;   # same limit as the gateway (the API takes JSON only; images are URLs)

    location = /up { # Laravel health check (also usable as readiness probe)
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass 127.0.0.1:9000;
    }

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;   # path INSIDE the php-fpm container
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_PROXY "";                                    # httpoxy
        fastcgi_read_timeout 60s;
        fastcgi_pass 127.0.0.1:9000;
    }
}
