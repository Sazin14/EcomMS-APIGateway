# DEV (HTTP only). Mounted as /etc/nginx/conf.d/default.conf
# For production with HTTPS, use nginx.prod.conf instead.

limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

upstream kong {
    server kong:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 5m;
    gzip on;
    gzip_types application/json text/csv;

    add_header X-Content-Type-Options "nosniff" always;

    # Proxy settings (inherited by every location below)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Internal-Key ""; # clients must never spoof service-to-service auth
    add_header X-Request-ID $request_id always;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # Brute-force protection on credential endpoints
    location ~ ^/api/auth/(staff|customer)/(login|register|refresh)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://kong;
    }

    # Product image uploads need a bigger body limit
    location ~ ^/api/admin/products/[^/]+/images$ {
        client_max_body_size 20m;
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://kong;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://kong;
    }
}
