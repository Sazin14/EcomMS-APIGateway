services:
  nginx:
    image: nginx:1.27
    restart: unless-stopped
    depends_on: [kong]
    ports:
      - "8080:80" # dev: http://localhost:8080 (use 80:80 and 443:443 in production)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  kong:
    image: kong:3.8
    restart: unless-stopped
    # No published ports: only nginx can reach Kong on the compose network.
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off" # reload with: docker compose restart kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      # Trust nginx so the real client IP / https scheme reach your services
      KONG_TRUSTED_IPS: 172.16.0.0/12
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets Kong reach services on the host (Linux)
