_format_version: "3.0"

# ---------------------------------------------------------------------------
# Kong (DB-less) = route management only. No plugins.
# Auth/authz stay in each service. TLS, rate limiting, body size, security
# headers, request IDs and stripping X-Internal-Key are done by nginx in front.
#
#  - Every Laravel service serves its routes under /api, so paths are forwarded
#    unchanged (strip_path: false). Kong paths are PREFIXES.
#  - host.docker.internal:8001-8005 = the machine where the services run
#    (php artisan serve --host=0.0.0.0 --port=800x). Production: kong.prod.yml.
#  - NEVER routed: /api/internal/* (service-to-service, X-Internal-Key).
#  - Each path belongs to exactly ONE service. When a service adds a route,
#    add its prefix here (and in kong.prod.yml).
# ---------------------------------------------------------------------------

services:
  # ======================= AuthService (8001) =======================
  - name: auth-service
    url: http://host.docker.internal:8001
    routes:
      - name: auth-routes
        strip_path: false
        preserve_host: true
        paths:
          - /api/auth
          - /api/customers
          - /api/staff
          - /api/roles
          - /api/permissions

  # ====================== ProductService ======================
  - name: product-service
    url: http://host.docker.internal:8002
    routes:
      - name: product-public-routes
        strip_path: false
        preserve_host: true
        paths:
          - /api/categories
          - /api/products
      - name: product-admin-routes
        strip_path: false
        preserve_host: true
        paths:
          - /api/admin/products
          - /api/admin/categories
          - /api/admin/attributes
          - /api/admin/attribute-values
          - /api/admin/brands
          - /api/admin/variants
          - /api/admin/images

  # ===================== InventoryService =====================
  - name: inventory-service
    url: http://host.docker.internal:8003
    routes:
      - name: inventory-public-routes
        strip_path: false
        preserve_host: true
        paths:
          - /api/availability
      - name: inventory-admin-routes
        strip_path: false
        preserve_host: true
        paths:
          - /api/admin/inventory
          - /api/admin/warehouses
          - /api/admin/stock
          - /api/admin/movements
          - /api/admin/alerts
          - /api/admin/reservations
          - /api/admin/reports
          - /api/admin/suppliers
          - /api/admin/purchase-orders
    # /api/admin/inventory/* = inventory pre-order dashboard + stock-return log
    # (/api/admin/preorders and /api/admin/returns belong to OrderService)

  # ====================== OrderService ======================
  - name: order-service
    url: http://host.docker.internal:8004
    routes:
      - name: order-customer-routes
        strip_path: false
        preserve_host: true
        paths:
          - /api/cart
          - /api/checkout
          - /api/orders
          - /api/preorders
          - /api/returns
      - name: order-payment-webhook
        strip_path: false
        preserve_host: true
        paths:
          - /api/payments/webhook
      - name: order-admin-routes
        strip_path: false
        preserve_host: true
        paths:
          - /api/admin/orders
          - /api/admin/preorders
          - /api/admin/payments
          - /api/admin/fulfillments
          - /api/admin/returns
          - /api/admin/refunds
    # /api/payments/webhook: called by the payment provider (no JWT; HMAC X-Signature).

  # =================== NotificationService ===================
  - name: notification-service
    url: http://host.docker.internal:8005
    routes:
      - name: notification-customer-routes
        strip_path: false
        preserve_host: true
        paths:
          - /api/notifications
          - /api/notification-preferences
      - name: notification-admin-routes
        strip_path: false
        preserve_host: true
        paths:
          - /api/admin/notifications
          - /api/admin/notification-templates
          - /api/admin/notification-deliveries
